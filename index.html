<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>시험 시계</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="topbar">
    <div class="field">
      <label for="startInput">시작 시각</label>
      <input type="time" id="startInput">
    </div>
    <div class="field">
      <label for="endInput">종료 시각</label>
      <input type="time" id="endInput">
    </div>
    <div class="field">
      <label>&nbsp;</label>
      <button id="actionBtn">시작</button>
    </div>
    <div class="field">
      <label for="soundToggle">소리</label>
      <label class="switch">
        <input type="checkbox" id="soundToggle">
        <span class="slider"></span>
      </label>
    </div>
  </div>

  <div class="period-row" id="periodRow">
    <button class="period-btn" data-period="p1">1교시(국어)</button>
    <button class="period-btn" data-period="p2">2교시(수학)</button>
    <button class="period-btn" data-period="p3">3교시(영어)</button>
    <button class="period-btn" data-period="p4h">4교시(한국사)</button>
    <button class="period-btn" data-period="p4e1">4교시(탐구1)</button>
    <button class="period-btn" data-period="p4e2">4교시(탐구2)</button>
  </div>

  <div class="main">
    <div class="clock-col">
      <svg id="clock" viewBox="0 0 200 200" width="200" height="200">
        <circle id="face" cx="100" cy="100" r="96"/>
        <g id="ticks"></g>
        <g id="numbers"></g>
        <line id="hourHand" x1="100" y1="100" x2="100" y2="58"/>
        <line id="minHand" x1="100" y1="100" x2="100" y2="34"/>
        <line id="secHand" x1="100" y1="112" x2="100" y2="22"/>
        <circle id="pin" cx="100" cy="100" r="4.5"/>
      </svg>
    </div>
    <div class="sidebar">
      <h2>수능 시간표</h2>
      <table>
        <tr><td>1교시 국어</td><td class="time">08:40–10:00</td></tr>
        <tr><td>2교시 수학</td><td class="time">10:30–12:10</td></tr>
        <tr><td>3교시 영어</td><td class="time">13:10–14:20</td></tr>
        <tr><td>4교시 한국사</td><td class="time">14:50–15:20</td></tr>
        <tr><td>4교시 탐구1</td><td class="time">15:30–16:00</td></tr>
        <tr><td>4교시 탐구2</td><td class="time">16:02–16:32</td></tr>
      </table>
    </div>
  </div>

<script src="script.js"></script>
</body>
</html>
