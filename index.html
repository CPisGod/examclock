<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>시험 시계</title>
<link rel="stylesheet" href="style.css?v=3">
</head>
<body>

  <div class="topbar">
    <div class="field hide-on-run">
      <label>종류</label>
      <div class="mode-group" id="kindGroup">
        <button class="mode-btn active" data-kind="clock">시계</button>
        <button class="mode-btn" data-kind="timer">타이머</button>
      </div>
    </div>
    <div class="field hide-on-run timer-only">
      <label>타이머 시간</label>
      <div class="dur-group" id="timerInput">
        <input type="number" id="tH" min="0" max="23" value="0" aria-label="시"><span>시</span>
        <input type="number" id="tM" min="0" max="59" value="10" aria-label="분"><span>분</span>
        <input type="number" id="tS" min="0" max="59" value="0" aria-label="초"><span>초</span>
      </div>
    </div>
    <div class="field hide-on-run clock-only">
      <label for="startInput">시작 시각</label>
      <input type="time" id="startInput" step="1">
    </div>
    <div class="field hide-on-run clock-only">
      <label for="endInput">종료 시각</label>
      <input type="time" id="endInput" step="1">
    </div>
    <div class="field">
      <label>&nbsp;</label>
      <button id="actionBtn">시작</button>
    </div>
    <div class="field" id="pauseField" style="display:none">
      <label>&nbsp;</label>
      <button id="pauseBtn">일시정지</button>
    </div>
    <div class="field">
      <label>표시 방식</label>
      <div class="mode-group" id="modeGroup">
        <button class="mode-btn active" data-mode="analog">아날로그</button>
        <button class="mode-btn" data-mode="digital">디지털</button>
      </div>
    </div>
    <div class="field hide-on-run">
      <label for="soundToggle">소리</label>
      <label class="switch">
        <input type="checkbox" id="soundToggle">
        <span class="slider"></span>
      </label>
    </div>
    <div class="field hide-on-run">
      <label>&nbsp;</label>
      <button id="testSoundBtn">소리 테스트</button>
    </div>
  </div>

  <div class="period-row hide-on-run clock-only" id="periodRow">
    <button class="period-btn" data-period="p1">1교시(국어)</button>
    <button class="period-btn" data-period="p2">2교시(수학)</button>
    <button class="period-btn" data-period="p3">3교시(영어)</button>
    <button class="period-btn" data-period="p4h">4교시(한국사)</button>
    <button class="period-btn" data-period="p4e1">4교시(탐구1)</button>
    <button class="period-btn" data-period="p4e2">4교시(탐구2)</button>
  </div>

  <div class="main">
    <div class="clock-col">
      <svg id="clock" viewBox="0 0 200 200" width="200" height="200">
        <circle id="face" cx="100" cy="100" r="96"/>
        <g id="ticks"></g>
        <g id="numbers"></g>
        <line id="hourHand" x1="100" y1="100" x2="100" y2="58"/>
        <line id="minHand" x1="100" y1="100" x2="100" y2="34"/>
        <line id="secHand" x1="100" y1="112" x2="100" y2="22"/>
        <circle id="pin" cx="100" cy="100" r="4.5"/>
      </svg>
      <svg id="digital" style="display:none" aria-label="디지털 시계"></svg>
    </div>
    <div class="sidebar">
      <h2>수능 시간표</h2>
      <table>
        <tr><td>1교시 국어</td><td class="time">08:40–10:00</td></tr>
        <tr><td>2교시 수학</td><td class="time">10:30–12:10</td></tr>
        <tr><td>3교시 영어</td><td class="time">13:10–14:20</td></tr>
        <tr><td>4교시 한국사</td><td class="time">14:50–15:20</td></tr>
        <tr><td>4교시 탐구1</td><td class="time">15:35–16:05</td></tr>
        <tr><td>4교시 탐구2</td><td class="time">16:07–16:37</td></tr>
      </table>
      <p class="sound-note">
        1~3교시는 시험 시간 15분 이상이어야 10분전 알림 뜨고, 4교시는 10분 이상이어야 5분전 알림 뜸.<br><br>made by cp
      </p>
    </div>
  </div>

<script src="script.js?v=3"></script>
</body>
</html>
