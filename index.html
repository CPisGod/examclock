<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>시험 시계</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    background: #ffffff;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Malgun Gothic", sans-serif;
  }
  .controls {
    display: flex;
    gap: 20px;
    padding: 22px 16px 6px;
    flex-wrap: wrap;
    justify-content: center;
    align-items: flex-end;
  }
  .field {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
  }
  .field label {
    font-size: 13px;
    color: #666;
    letter-spacing: 0.02em;
  }
  .field input[type="time"] {
    font-size: 16px;
    padding: 6px 10px;
    border: 1px solid #ccc;
    border-radius: 6px;
    background: #fff;
    color: #111;
  }
  .field input[type="time"]:disabled {
    background: #f2f2f2;
    color: #999;
  }
  #actionBtn {
    font-size: 15px;
    padding: 8px 20px;
    border: 1px solid #1a1a1a;
    border-radius: 6px;
    background: #1a1a1a;
    color: #fff;
    cursor: pointer;
  }
  #actionBtn:active { opacity: 0.75; }
  .clock-wrap {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    padding: 10px 0 30px;
  }
  #clock {
    width: min(62vw, 300px);
    height: auto;
    display: block;
  }
  #clock.alarm {
    animation: pulse 1s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.055); }
  }
  .tick-minor { stroke: #d5d5d5; stroke-width: 1; }
  .tick-major { stroke: #1a1a1a; stroke-width: 2.5; }
  .num {
    font-size: 12px;
    font-weight: 600;
    fill: #1a1a1a;
    text-anchor: middle;
    dominant-baseline: middle;
    font-family: inherit;
  }
  #hourHand { stroke: #1a1a1a; stroke-width: 6; stroke-linecap: round; }
  #minHand { stroke: #1a1a1a; stroke-width: 4; stroke-linecap: round; }
  #secHand { stroke: #c0392b; stroke-width: 2; stroke-linecap: round; }
  #face { fill: #ffffff; stroke: #1a1a1a; stroke-width: 3; }
  #pin { fill: #1a1a1a; }
</style>
</head>
<body>

  <div class="controls">
    <div class="field">
      <label for="startInput">시작 시각</label>
      <input type="time" id="startInput">
    </div>
    <div class="field">
      <label for="endInput">종료 시각</label>
      <input type="time" id="endInput">
    </div>
    <button id="actionBtn">시작</button>
  </div>

  <div class="clock-wrap">
    <svg id="clock" viewBox="0 0 200 200" width="200" height="200">
      <circle id="face" cx="100" cy="100" r="96"/>
      <g id="ticks"></g>
      <g id="numbers"></g>
      <line id="hourHand" x1="100" y1="100" x2="100" y2="58"/>
      <line id="minHand" x1="100" y1="100" x2="100" y2="34"/>
      <line id="secHand" x1="100" y1="112" x2="100" y2="22"/>
      <circle id="pin" cx="100" cy="100" r="4.5"/>
    </svg>
  </div>

<script>
  const svgNS = "http://www.w3.org/2000/svg";
  const ticksG = document.getElementById('ticks');
  const numsG = document.getElementById('numbers');
  const cx = 100, cy = 100, r = 96;

  for (let i = 0; i < 60; i++) {
    const angle = (i * 6) * Math.PI / 180;
    const isMajor = i % 5 === 0;
    const rOuter = r - 2;
    const rInner = isMajor ? r - 13 : r - 6;
    const x1 = cx + rOuter * Math.sin(angle);
    const y1 = cy - rOuter * Math.cos(angle);
    const x2 = cx + rInner * Math.sin(angle);
    const y2 = cy - rInner * Math.cos(angle);
    const line = document.createElementNS(svgNS, 'line');
    line.setAttribute('x1', x1);
    line.setAttribute('y1', y1);
    line.setAttribute('x2', x2);
    line.setAttribute('y2', y2);
    line.setAttribute('class', isMajor ? 'tick-major' : 'tick-minor');
    ticksG.appendChild(line);
  }

  for (let n = 1; n <= 12; n++) {
    const angle = (n * 30) * Math.PI / 180;
    const rNum = r - 23;
    const x = cx + rNum * Math.sin(angle);
    const y = cy - rNum * Math.cos(angle);
    const text = document.createElementNS(svgNS, 'text');
    text.setAttribute('x', x);
    text.setAttribute('y', y);
    text.setAttribute('class', 'num');
    text.textContent = String(n);
    numsG.appendChild(text);
  }

  const faceEl = document.getElementById('face');
  const pinEl = document.getElementById('pin');
  const hourHand = document.getElementById('hourHand');
  const minHand = document.getElementById('minHand');
  const secHand = document.getElementById('secHand');
  const clockEl = document.getElementById('clock');
  const startInput = document.getElementById('startInput');
  const endInput = document.getElementById('endInput');
  const actionBtn = document.getElementById('actionBtn');
  const numTexts = numsG.querySelectorAll('text');

  function pad(n) { return String(n).padStart(2, '0'); }

  const nowDefault = new Date();
  startInput.value = `${pad(nowDefault.getHours())}:${pad(nowDefault.getMinutes())}`;
  const endDefault = new Date(nowDefault.getTime() + 60 * 60 * 1000);
  endInput.value = `${pad(endDefault.getHours())}:${pad(endDefault.getMinutes())}`;

  let alarmOn = false;
  let colorTimer = null;
  let hue = 0;

  function enterAlarm() {
    if (alarmOn) return;
    alarmOn = true;
    clockEl.classList.add('alarm');
    colorTimer = setInterval(() => {
      hue = (hue + 9) % 360;
      faceEl.style.fill = `hsl(${hue}, 92%, 88%)`;
      faceEl.style.stroke = `hsl(${(hue + 180) % 360}, 90%, 38%)`;
      hourHand.style.stroke = `hsl(${(hue + 240) % 360}, 100%, 42%)`;
      minHand.style.stroke = `hsl(${(hue + 120) % 360}, 100%, 45%)`;
      secHand.style.stroke = `hsl(${(hue + 60) % 360}, 100%, 50%)`;
      pinEl.style.fill = `hsl(${(hue + 300) % 360}, 100%, 38%)`;
      numTexts.forEach((t, idx) => {
        t.style.fill = `hsl(${(hue + idx * 20) % 360}, 100%, 42%)`;
      });
    }, 80);
  }

  function exitAlarm() {
    if (!alarmOn) return;
    alarmOn = false;
    clockEl.classList.remove('alarm');
    clearInterval(colorTimer);
    faceEl.style.fill = '';
    faceEl.style.stroke = '';
    hourHand.style.stroke = '';
    minHand.style.stroke = '';
    secHand.style.stroke = '';
    pinEl.style.fill = '';
    numTexts.forEach(t => t.style.fill = '');
  }

  function setHands(h, m, s) {
    const secAngle = s * 6;
    const minAngle = m * 6 + s * 0.1;
    const hourAngle = (h % 12) * 30 + m * 0.5;
    hourHand.setAttribute('transform', `rotate(${hourAngle} ${cx} ${cy})`);
    minHand.setAttribute('transform', `rotate(${minAngle} ${cx} ${cy})`);
    secHand.setAttribute('transform', `rotate(${secAngle} ${cx} ${cy})`);
  }

  function renderStatic() {
    if (!startInput.value) { setHands(0, 0, 0); return; }
    const [h, m] = startInput.value.split(':').map(Number);
    setHands(h, m, 0);
  }

  function parseTimeToday(value) {
    const [h, m] = value.split(':').map(Number);
    const d = new Date();
    d.setHours(h, m, 0, 0);
    return d.getTime();
  }

  let running = false;
  let virtualStartMs = 0;
  let virtualEndMs = 0;
  let realStartTimestamp = 0;

  function startClock() {
    if (!startInput.value || !endInput.value) return;
    virtualStartMs = parseTimeToday(startInput.value);
    let endMs = parseTimeToday(endInput.value);
    if (endMs <= virtualStartMs) endMs += 24 * 60 * 60 * 1000;
    virtualEndMs = endMs;
    realStartTimestamp = Date.now();
    running = true;
    startInput.disabled = true;
    endInput.disabled = true;
    actionBtn.textContent = '초기화';
  }

  function resetClock() {
    running = false;
    exitAlarm();
    startInput.disabled = false;
    endInput.disabled = false;
    actionBtn.textContent = '시작';
    renderStatic();
  }

  actionBtn.addEventListener('click', () => {
    if (running) resetClock();
    else startClock();
  });

  startInput.addEventListener('input', () => {
    if (!running) renderStatic();
  });

  function tick() {
    if (!running) return;
    const virtualMs = virtualStartMs + (Date.now() - realStartTimestamp);
    const vd = new Date(virtualMs);
    setHands(vd.getHours(), vd.getMinutes(), vd.getSeconds());
    if (virtualMs >= virtualEndMs) {
      enterAlarm();
    }
  }

  renderStatic();
  setInterval(tick, 250);
</script>
</body>
</html>
